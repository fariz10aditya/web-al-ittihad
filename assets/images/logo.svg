<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="royalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f5deb3" />
    </linearGradient>
    <linearGradient id="goldCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Pentagon Shield (Segilima Rukun Islam & Pancasila) -->
  <!-- Coordinates of regular pentagon centered at (250, 255) with radius ~225 -->
  <!-- Top: (250, 30), Top-Right: (464, 185), Bottom-Right: (382, 438), Bottom-Left: (118, 438), Top-Left: (36, 185) -->
  <polygon points="250,22 472,183 387,445 113,445 28,183" 
           fill="url(#goldCream)" stroke="#172554" stroke-width="4" filter="url(#shadowFilter)"/>

  <!-- Inner Navy Blue Pentagon -->
  <polygon points="250,38 454,186 376,428 124,428 46,186" 
           fill="url(#navyGrad)" stroke="#fef3c7" stroke-width="5"/>

  <!-- Thin Cream Inner Border -->
  <polygon points="250,48 444,190 370,418 130,418 56,190" 
           fill="none" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Circular Ring for Text -->
  <circle cx="250" cy="245" r="148" fill="#172554" stroke="url(#goldCream)" stroke-width="3"/>

  <!-- Circular Text Paths -->
  <path id="txtPathTop" d="M 112 245 A 138 138 0 0 1 388 245" fill="none"/>
  <path id="txtPathBottom" d="M 388 245 A 138 138 0 0 1 112 245" fill="none"/>

  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#fef3c7" letter-spacing="2.8">
    <textPath href="#txtPathTop" startOffset="50%" text-anchor="middle">
      MA AL-ITTIHAD TAWANGSARI
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#fef08a" letter-spacing="2.5">
    <textPath href="#txtPathBottom" startOffset="50%" text-anchor="middle">
      ★ TROWULAN • MOJOKERTO ★
    </textPath>
  </text>

  <!-- Central Inner Circle (Krem Background) -->
  <circle cx="250" cy="245" r="112" fill="url(#creamGrad)" stroke="#1e3a8a" stroke-width="3"/>

  <!-- 9 Stars of Ahlussunnah wal Jama'ah (NU Heritage) -->
  <g fill="url(#goldCream)" stroke="#b45309" stroke-width="0.5">
    <!-- Center Top Main Star (Rasulullah SAW) -->
    <polygon points="250,146 253,154 261,154 255,159 257,167 250,162 243,167 245,159 239,154 247,154"/>
    <!-- 4 Khulafaur Rasyidin Stars (Upper Arc) -->
    <polygon points="220,154 222,160 228,160 223,164 225,170 220,166 215,170 217,164 212,160 218,160" transform="scale(0.8) translate(50, 30)"/>
    <polygon points="280,154 282,160 288,160 283,164 285,170 280,166 275,170 277,164 272,160 278,160" transform="scale(0.8) translate(70, 30)"/>
    <polygon points="195,168 197,173 202,173 198,177 200,182 195,179 190,182 192,177 188,173 193,173" transform="scale(0.8) translate(40, 36)"/>
    <polygon points="305,168 307,173 312,173 308,177 310,182 305,179 300,182 302,177 298,173 303,173" transform="scale(0.8) translate(80, 36)"/>
  </g>

  <!-- Islamic Dome & Minaret of Ponpes Al-Ittihad -->
  <g transform="translate(250, 205)">
    <!-- Minaret Spire -->
    <path d="M0 -30 L-2 -18 L2 -18 Z" fill="#ca8a04"/>
    <circle cx="0" cy="-30" r="3" fill="#eab308"/>
    <!-- Crescent on Dome -->
    <path d="M-2 -37 A 5 5 0 1 0 4 -32 A 4 4 0 1 1 -2 -37 Z" fill="#ca8a04"/>
    <!-- Main Mosque Dome -->
    <path d="M0 -18 C-26 -18 -38 6 -42 18 L42 18 C38 6 26 -18 0 -18 Z" fill="#1e3a8a" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M-15 18 C-15 5 0 2 0 2 C0 2 15 5 15 18 Z" fill="#fef3c7"/>
  </g>

  <!-- Open Quran Book on Wooden Rehal -->
  <g transform="translate(250, 248)" filter="url(#shadowFilter)">
    <!-- Wooden Rehal Base -->
    <path d="M-45 42 L-16 20 L-12 24 L-38 48 Z" fill="#78350f"/>
    <path d="M45 42 L16 20 L12 24 L38 48 Z" fill="#92400e"/>
    <path d="M-16 20 L0 32 L16 20 L0 12 Z" fill="#b45309"/>

    <!-- Open Book Pages Left -->
    <path d="M0 4 C-20 -10 -55 -12 -70 4 C-60 20 -35 26 0 22 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M-62 6 C-48 -3 -20 0 -5 12" fill="none" stroke="#1e3a8a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-60 12 C-48 3 -20 6 -5 18" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Open Book Pages Right -->
    <path d="M0 4 C20 -10 55 -12 70 4 C60 20 35 26 0 22 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M62 6 C48 -3 20 0 5 12" fill="none" stroke="#1e3a8a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M60 12 C48 3 20 6 5 18" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Bookmark Ribbon -->
    <path d="M0 12 L0 34 L-4 30 L-8 34 L-8 12 Z" fill="#dc2626"/>
  </g>

  <!-- Padi & Kapas (Wreath of Knowledge & Prosperity) -->
  <g stroke="#ca8a04" stroke-width="2" fill="none">
    <!-- Left Padi Seeds -->
    <circle cx="152" cy="225" r="3.5" fill="#eab308"/>
    <circle cx="146" cy="246" r="3.5" fill="#eab308"/>
    <circle cx="148" cy="268" r="3.5" fill="#eab308"/>
    <circle cx="158" cy="290" r="3.5" fill="#eab308"/>
    <!-- Right Kapas Blossoms -->
    <circle cx="348" cy="225" r="3.5" fill="#fef3c7"/>
    <circle cx="354" cy="246" r="3.5" fill="#fef3c7"/>
    <circle cx="352" cy="268" r="3.5" fill="#fef3c7"/>
    <circle cx="342" cy="290" r="3.5" fill="#fef3c7"/>
  </g>

  <!-- MALTA Ribbon / Banner at Bottom -->
  <g transform="translate(250, 362)" filter="url(#shadowFilter)">
    <!-- Ribbon Tails -->
    <path d="M-115 10 L-135 0 L-135 28 L-115 20 Z" fill="#996515"/>
    <path d="M115 10 L135 0 L135 28 L115 20 Z" fill="#996515"/>

    <!-- Main Ribbon Body -->
    <rect x="-115" y="-3" width="230" height="32" rx="6" fill="url(#goldCream)" stroke="#78350f" stroke-width="2"/>

    <!-- Banner Text MALTA -->
    <text x="0" y="20" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="4">
      ★ MALTA ★
    </text>
  </g>

  <!-- Sub-badge: YPIS & NPSN -->
  <g transform="translate(250, 412)">
    <rect x="-85" y="-10" width="170" height="20" rx="10" fill="#172554" stroke="url(#goldCream)" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#fef3c7" text-anchor="middle" letter-spacing="1.2">
      NPSN 20584241 • AKREDITASI B
    </text>
  </g>
</svg>
